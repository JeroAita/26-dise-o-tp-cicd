name: CI - Docker y GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Definir nombre de imagen
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "hub=${DOCKER_HUB_USERNAME,,}/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"
        env:
          DOCKER_HUB_USERNAME: ${{ vars.DOCKER_HUB_USERNAME }}

      - name: Construir imagen Docker
        shell: bash
        run: docker build -t dds-devops-demo:test .

      - name: Verificar funcionamiento
        shell: bash
        run: |
          set -euo pipefail

          cleanup() {
            docker rm -f web-test >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d --name web-test \
            -p 127.0.0.1:8080:80 \
            dds-devops-demo:test

          for i in $(seq 1 20); do
            if ! docker ps --format '{{.Names}}' | grep -qx web-test; then
              echo "El contenedor web-test no esta corriendo"
              docker ps -a
              docker logs web-test || true
              exit 1
            fi

            HTTP_CODE=$(curl -s -o /tmp/body.html -w "%{http_code}" \
              --max-time 2 http://127.0.0.1:8080/ || echo 000)

            if [ "$HTTP_CODE" = "200" ] && [ -s /tmp/body.html ]; then
              echo "Prueba exitosa (HTTP $HTTP_CODE, contenido no vacio)"
              exit 0
            fi

            echo "Intento $i: HTTP=$HTTP_CODE, esperando..."
            sleep 1
          done

          echo "La verificacion fallo tras 20 intentos"
          docker ps -a
          docker logs web-test || true
          exit 1

      - name: Autenticarse en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Autenticarse en Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PAT }}

      - name: Etiquetar imagen para ambos registries
        shell: bash
        run: |
          TAG="${GITHUB_SHA::7}"

          docker tag dds-devops-demo:test \
            "${{ steps.image.outputs.ghcr }}:$TAG"

          docker tag dds-devops-demo:test \
            "${{ steps.image.outputs.ghcr }}:latest"

          docker tag dds-devops-demo:test \
            "${{ steps.image.outputs.hub }}:$TAG"

          docker tag dds-devops-demo:test \
            "${{ steps.image.outputs.hub }}:latest"

      - name: Publicar imagen en GHCR
        shell: bash
        run: |
          TAG="${GITHUB_SHA::7}"
          docker push "${{ steps.image.outputs.ghcr }}:$TAG"
          docker push "${{ steps.image.outputs.ghcr }}:latest"

      - name: Publicar imagen en Docker Hub
        shell: bash
        run: |
          TAG="${GITHUB_SHA::7}"
          docker push "${{ steps.image.outputs.hub }}:$TAG"
          docker push "${{ steps.image.outputs.hub }}:latest"
